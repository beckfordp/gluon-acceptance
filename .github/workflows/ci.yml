name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No cluster and no browsers in CI: scenarios run locally against
      # gluon-local. No GitHub Packages token: nothing here depends on
      # beckfordp/purerest.
      # bddgen fails on missing or ambiguous steps, without needing a browser.
      - name: bddgen + lint + typecheck + unit tests
        run: npx bddgen && npm run lint && npm run typecheck && npm test
